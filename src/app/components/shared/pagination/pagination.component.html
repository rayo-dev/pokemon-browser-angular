<nav class="pagination" aria-label="Paginación del listado de Pokémon">
  <button class="page-button" [disabled]="!canGoBack" type="button" (click)="back()"
    aria-label="Página anterior">
    <span aria-hidden="true">←</span>
    <span class="button-label">Anterior</span>
  </button>

  <span class="page-status" aria-live="polite">
    Página <strong>{{ currentPage }}</strong> de <strong>{{ totalPages }}</strong>
    <span class="record-count">· {{ (resource.count_rows ?? 0) | number }} Pokémon</span>
  </span>

  <button class="page-button" [disabled]="!canGoNext" type="button" (click)="next()"
    aria-label="Página siguiente">
    <span class="button-label">Siguiente</span>
    <span aria-hidden="true">→</span>
  </button>
</nav>
